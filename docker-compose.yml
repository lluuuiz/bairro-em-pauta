# Banco PostgreSQL para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bairro_em_pauta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
