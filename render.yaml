# Render Blueprint: cria o back-end Django e o PostgreSQL de uma vez.
databases:
  - name: bairro-db
    databaseName: bairro_em_pauta
services:
  - type: web
    name: bairro-em-pauta-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: bairro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: SEED
        value: "1"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS   # preencha depois com o link do front-end
        sync: false
      - key: CSRF_TRUSTED_ORIGINS   # idem
        sync: false
